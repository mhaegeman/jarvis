[project]
name = "jarvis-server"
version = "0.0.1"
description = "Jarvis WebSocket server (spec-02 Phase 1, mock pipelines)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=13",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "psutil>=5.9",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "google-api-python-client>=2.140",
  "anthropic>=0.40,<1.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-psutil>=5.9",
  # Required to import server.pipelines.whisper_stt for unit tests, even
  # though the real STT engine itself lives behind the [stt] extra.
  "numpy>=1.26",
]
stt = [
  "faster-whisper>=1.0",
  "numpy>=1.26",
]
tts = [
  "torch>=2.1",
  "numpy>=1.26",
  "librosa>=0.10",
  "soundfile>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["requires_models: tests that need real Whisper/LLM/OpenVoice (Phase 2)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["server"]
