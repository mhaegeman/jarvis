<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Jarvis — B · Waveform</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg-0: #02040a;
    --bg-1: #050b18;
    --fg: #e8efff;
    --accent: #7df9ff;
    --accent-dim: rgba(125,249,255,.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    color: var(--fg);
    font-family: -apple-system, "SF Pro Display", "Inter", system-ui, sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .label {
    position: fixed; top: 24px; left: 28px;
    letter-spacing: .3em; text-transform: uppercase; font-size: 11px;
    color: rgba(232,239,255,.55); z-index: 2;
  }
  .transcript {
    position: fixed; left: 50%; top: 32%; transform: translateX(-50%);
    text-align: center; max-width: 760px; padding: 0 6vw;
    font-size: clamp(18px, 2.2vw, 26px);
    letter-spacing: .005em;
    line-height: 1.45;
    color: rgba(232,239,255,.95);
    text-shadow: 0 0 24px rgba(125,249,255,.25);
    z-index: 2;
  }
  .meta {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .35em; text-transform: uppercase;
    color: rgba(232,239,255,.45); z-index: 2;
  }
  .controls {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; z-index: 2;
  }
  button {
    appearance: none; background: rgba(125,249,255,.05);
    color: var(--fg); border: 1px solid var(--accent-dim);
    border-radius: 4px; padding: 12px 22px;
    font: inherit; letter-spacing: .14em; text-transform: uppercase; font-size: 11px;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: background .2s, border-color .2s;
  }
  button:hover { background: rgba(125,249,255,.12); border-color: var(--accent); }
</style>
</head>
<body>
  <div class="label">Prototype B · Audio-reactive Waveform</div>
  <canvas id="c"></canvas>
  <div class="transcript" id="text"></div>
  <div class="meta" id="meta">— idle —</div>
  <div class="controls">
    <button id="speakBtn">Speak</button>
    <button id="listenBtn">Listen</button>
    <button id="idleBtn">Idle</button>
  </div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width  = innerWidth  * DPR;
    H = canvas.height = innerHeight * DPR;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  addEventListener('resize', resize); resize();

  let mode = 'idle';
  let amp = 0.12;
  let targetAmp = 0.12;

  // Fake speech amplitude envelope
  function pickAmp() {
    if (mode === 'idle')   return 0.08 + Math.random()*0.05;
    if (mode === 'listen') return 0.18 + Math.random()*0.10;
    /* speak */            return 0.45 + Math.random()*0.45;
  }
  setInterval(() => { targetAmp = pickAmp(); }, 110);

  // Particle field
  const particles = Array.from({length: 80}, () => ({
    x: Math.random(), y: Math.random(),
    vx: (Math.random()-.5)*0.0004,
    vy: (Math.random()-.5)*0.0004,
    r: Math.random()*1.4 + 0.3
  }));

  let t = 0;
  function frame() {
    t += 1;
    amp += (targetAmp - amp) * 0.12;

    ctx.fillStyle = 'rgba(2,4,10,0.18)';
    ctx.fillRect(0, 0, W, H);

    // Particles
    ctx.fillStyle = 'rgba(125,249,255,0.45)';
    for (const p of particles) {
      p.x += p.vx + amp*0.0002;
      p.y += p.vy;
      if (p.x < 0) p.x += 1; if (p.x > 1) p.x -= 1;
      if (p.y < 0) p.y += 1; if (p.y > 1) p.y -= 1;
      ctx.beginPath();
      ctx.arc(p.x*W, p.y*H, p.r*DPR, 0, Math.PI*2);
      ctx.fill();
    }

    // Three layered waveforms
    const cy = H*0.5;
    const layers = [
      { hue: 'rgba(125,249,255,', alpha: 0.85, ampMul: 1.0,  freq: 0.012, speed: 0.05 },
      { hue: 'rgba(125,249,255,', alpha: 0.45, ampMul: 0.7,  freq: 0.008, speed: 0.03 },
      { hue: 'rgba(168,200,255,', alpha: 0.30, ampMul: 1.4,  freq: 0.020, speed: 0.07 }
    ];
    for (const L of layers) {
      ctx.beginPath();
      ctx.lineWidth = 2 * DPR;
      ctx.strokeStyle = L.hue + L.alpha + ')';
      ctx.shadowBlur = 24 * DPR;
      ctx.shadowColor = L.hue + '0.6)';
      for (let x = 0; x <= W; x += 4*DPR) {
        const env = Math.sin(x*0.001 + t*0.003) * 0.5 + 0.5; // amplitude envelope across width
        const y = cy
          + Math.sin(x * L.freq + t * L.speed) * H * 0.18 * amp * L.ampMul * env
          + Math.sin(x * L.freq*2.2 + t * L.speed*1.3) * H * 0.06 * amp * L.ampMul;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    requestAnimationFrame(frame);
  }
  frame();

  // Transcript streaming
  const lines = [
    "Two interviews scheduled. Briefing notes ready in your inbox.",
    "Synthesising three days of research now.",
    "Listening."
  ];
  const text = document.getElementById('text');
  const meta = document.getElementById('meta');
  let typer = null;
  function stream(s) {
    clearTimeout(typer); text.textContent = '';
    let i = 0;
    (function step(){
      text.textContent = s.slice(0, i++);
      if (i <= s.length) typer = setTimeout(step, 24 + Math.random()*32);
    })();
  }

  function setMode(m) {
    mode = m;
    meta.textContent = m === 'speak' ? '— speaking —' : m === 'listen' ? '— listening —' : '— idle —';
  }

  document.getElementById('speakBtn').onclick  = () => { setMode('speak');  stream(lines[0]); };
  document.getElementById('listenBtn').onclick = () => { setMode('listen'); stream(lines[2]); };
  document.getElementById('idleBtn').onclick   = () => { setMode('idle');   text.textContent = ''; };
</script>
</body>
</html>
